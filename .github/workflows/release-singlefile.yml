name: Build Singlefile Release Asset

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Standalone Single-File App
        run: npm run build

      - name: Prepare Release Artifact
        run: |
          mkdir -p release-assets
          cp dist/index.html release-assets/bucket-budget-standalone.html

      - name: Upload Single-File HTML to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: release-assets/bucket-budget-standalone.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
